name: SAPAR CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit Tests & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'SaparCore/sapar-typescript-backend/package-lock.json'

      - name: Install Dependencies
        working-directory: SaparCore/sapar-typescript-backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: SaparCore/sapar-typescript-backend
        run: npx prisma generate

      - name: Run Backend Vitest Suite
        working-directory: SaparCore/sapar-typescript-backend
        run: npm test

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'SaparCore/sapar-typescript-frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: SaparCore/sapar-typescript-frontend
        run: npm install --no-audit --no-fund

      - name: Build Frontend
        working-directory: SaparCore/sapar-typescript-frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: 'false'
          VITE_API_BASE_URL: 'http://localhost:3001'

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: SaparCore/sapar-typescript-backend
          file: SaparCore/sapar-typescript-backend/Dockerfile
          push: false
          tags: sapar-api:test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: SaparCore/sapar-typescript-frontend
          file: SaparCore/sapar-typescript-frontend/Dockerfile
          push: false
          tags: sapar-web:test
