services:
  # ==============================================================================
  # SAPAR BACKEND API (Node.js + Express + Prisma ORM)
  # ==============================================================================
  - type: web
    name: sapar-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: SaparCore/sapar-typescript-backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node seedDefaults.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sapar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTO_SEED_DEMO
        value: "true"

  # ==============================================================================
  # SAPAR FRONTEND (React + Vite + Tailwind CSS v4 SPA)
  # ==============================================================================
  - type: web
    name: sapar-frontend
    runtime: static
    plan: free
    region: frankfurt
    rootDir: SaparCore/sapar-typescript-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sapar-api
          property: host

# ==============================================================================
# POSTGRESQL DATABASE (Render Managed Database)
# ==============================================================================
databases:
  - name: sapar-db
    databaseName: sapar
    user: sapar
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
